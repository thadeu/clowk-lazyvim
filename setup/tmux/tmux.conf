# tmux config for clowk-lazyvim.
#
# setup/install.sh installs this file whole, and any ~/.tmux.conf already on the
# machine is moved to ~/.tmux.conf.backup-<timestamp> first. The repo owns the
# file: that is what makes a second machine come out like the first, splits and
# plugins included, instead of only receiving the parts this config needs.
#
# Everything here except the last section is personal preference -- change it and
# re-run the installer, or edit ~/.tmux.conf directly and copy it back.

#unbind r
#bind r source-file ~/.tmux.conf; display "Reloaded"

set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'

#bind-key h select-pane -L
#bind-key j select-pane -D
#bind-key k select-pane -U
#bind-key l select-pane -R

#set-option -g status-position top
set-option -g history-limit 5000

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'dracula/tmux'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'sainnhe/tmux-fzf'

set -g @dracula-plugins "cpu-usage gpu-usage ram-usage"
set -g @dracula-show-powerline true

set -g @scroll-speed-num-lines-per-scroll 5

set-option -g allow-rename off

set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# clock mode
setw -g clock-mode-colour colour1

# copy mode
setw -g mode-style 'fg=colour1 bg=colour18 bold'

# pane borders
set -g pane-border-style 'fg=colour1'
set -g pane-active-border-style 'fg=colour3'

# Set 256 colors
set -s default-terminal 'tmux-256color'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=colour1'
set -g status-left ''
set -g status-right '%Y-%m-%d %H:%M '
set -g status-right-length 50
set -g status-left-length 10

setw -g window-status-current-style 'fg=colour0 bg=colour1 bold'
setw -g window-status-current-format ' #I #W #F '

setw -g window-status-style 'fg=colour1 dim'
setw -g window-status-format ' #I #[fg=colour7]#W #[fg=colour1]#F '

setw -g window-status-bell-style 'fg=colour2 bg=colour1 bold'

# messages
set -g message-style 'fg=colour2 bg=colour0 bold'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# --- Everything below sits under `run tpm` on purpose ------------------------
#
# It breaks the usual "keep tpm last" rule: plugins run where tpm is sourced,
# and dracula turns the status bar back on, so `status off` placed above it is
# silently undone.

# cmd+j: floating terminal, centered over the pane.
#
# Ghostty rewrites cmd+j into ESC+j, which tmux reads as M-j -- and tmux gets
# the key before Neovim does, so inside tmux this binding replaces Neovim's own
# float (which is still there, for when you are not in tmux). The popup is a
# pty owned by tmux rather than Neovim's terminal emulator, and that is the
# whole point: a full-screen TUI like Claude Code redraws itself correctly in
# one and not in the other.
#
# One scratch session per directory, named after the path with `/` and `.`
# folded into `-`. `-A` attaches to it when it already exists, so the shell and
# whatever runs in it survive closing the popup -- and survive quitting Neovim,
# since the session outlives the one Neovim runs in. Another project still gets
# its own. The session inherits the popup's working directory, which `-d` sets
# to the pane's, so no `-c` is needed.
#
# Pressing the same key inside the popup detaches that client: the popup closes
# and the session keeps running.
bind -n M-j if -F '#{m:scratch-*,#{session_name}}' {
  detach-client
} {
  display-popup -E -w 80% -h 80% -d '#{pane_current_path}' 'tmux new-session -A -s "scratch-$(printf %s "$PWD" | tr "/." "--")"'
}

# Splits by shape, not by shifted punctuation: `|` splits vertically and `-`
# horizontally, and the defaults they replace are unbound so there is one key
# per split. Same mnemonic Neovim answers for cmd+| inside the editor, and the
# one that reaches the cmd+j popup, where tmux is the thing splitting.
bind | split-window -h
bind - split-window -v
unbind '"'
unbind %

# Mouse mode is what lets the wheel scroll Claude Code's fullscreen renderer
# instead of tmux's own scrollback -- its docs ask for this line by name.
set -g mouse on

# ESC+key only assembles into M-key while this timer is open. tmux defaults to
# 500ms, which would put half a second on every cmd+ shortcut Ghostty forwards.
set -sg escape-time 10

# Neovim seen through the tmux layer: tmux-256color alone caps colour at 256 and
# drops undercurl, so both have to be advertised as features of the outer
# terminal.
set -as terminal-features ",*:RGB"
set -as terminal-features ",*:usstyle"

# Ghostty's inline image protocol (snacks' markdown preview) is passthrough
# traffic that tmux swallows by default. Claude Code needs the same line for its
# desktop notifications and progress bar to reach the outer terminal.
set -g allow-passthrough on

# Without these tmux cannot tell shift+enter from enter, which is how Claude
# Code inserts a newline instead of submitting the prompt.
#
# The pattern is `*` and not `xterm*` because of the cmd+j popup: what runs in
# it is a second tmux client, and its TERM is tmux-256color, set by the tmux
# around it. An `xterm*` pattern matches the outer client and skips that inner
# one, so the popup never asks for extended keys and shift+enter arrives there
# as a plain Enter -- the one place a full-screen Claude Code lives. Check it
# with `tmux list-clients -F '#{client_termname} #{client_termfeatures}'`:
# every line must carry `extkeys`.
set -s extended-keys on
set -as terminal-features '*:extkeys'

set -g focus-events on

# No tmux status bar: here tmux only hosts Neovim and the popup, and lualine
# already shows the branch, the file and the clock -- two bars stacked is one
# wasted row. `prefix + : set status on` brings it back for one session.
set -g status off
